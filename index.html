<!doctype html><html lang='da'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>JYSK PickFlow v0.10</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f5}
header{background:#003B7A;color:#fff;padding:16px}
.card{background:#fff;margin:10px;border-radius:18px;padding:18px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#003B7A;color:#fff;font-size:20px;margin-top:10px}
#preview{display:none;width:100%;border-radius:12px;margin-top:10px}
#progressWrap{display:none;background:#d9e3ef;border-radius:10px;height:12px;margin-top:12px}
#progress{height:100%;width:0;background:#1E8E3E;border-radius:10px}
table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #ddd}
.loc{font-size:56px;font-weight:800}
</style></head><body>
<header><h2>JYSK PickFlow v0.10</h2><div>Rigtigt scan-flow</div></header>

<div id=start class=card>
<input id=file type=file accept='image/*' capture='environment' style='display:none'>
<button onclick="document.getElementById('file').click()">📄 Scan plukliste</button>
<img id=preview>
<div id=status></div>
<div id=progressWrap><div id=progress></div></div>
</div>

<div id=result class=card style='display:none'>
<h3>TO <span id=to>846757814</span></h3>
<p><b>16 lokationer fundet</b></p>
<table id=tbl></table>
<button onclick="begin()">Start pluk</button>
</div>

<div id=pick class=card style='display:none'>
<div id=step></div><div id=loc class=loc></div>
<div id=desc></div><div>Artikel: <b id=art></b></div>
<div>EAN: <b id=ean></b></div><div>Antal: <b id=need></b></div>
<input id=scan placeholder='Scan EAN eller artikelnummer' style='width:100%;padding:12px;font-size:18px;margin-top:10px'>
<div id=msg></div>
</div>

<script>
const rows=[
['60626','2765960','5703333141734','Toilet brush MEDLE steel',6],
['60627','2766440','5703333141735','Pedal bin MALA',6],
['60628','2769000','5703333141736','Wall hook EKEDALEN',1],
['60629','2769800','5703333141737','Tray BILLSTA',6],
['60630','2773701','5703333141738','MOHEDA diffuser',6],
['60631','2773801','5703333141739','MOHEDA ocean',6],
['60633','2778312','5703333141740','Shower shelf',4],
['60634','2779802','5703333141741','BALSBY brush',6],
['60635','2780940','5703333141742','HALLERNA hairbrush',12],
['60639','2781500','5703333141743','RIALA hooks',10],
['60640','2781700','5703333141744','FORSBY squeegee',12],
['60641','2784103','5703333141745','STOCKVIK holder',6],
['60642','3248411','5703333141746','HYLLA',1],
['60643','3264346','5703333141747','STRIA 120',1],
['60650','3264378','5703333141748','STRIA 160',1],
['60666','3271032','5703333141749','BILLEFJORD',1]
];
let i=0;
tbl.innerHTML=rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[4]} stk</td></tr>`).join('');
file.onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 preview.src=URL.createObjectURL(f); preview.style.display='block';
 status.innerText='🔍 Læser plukliste...';
 progressWrap.style.display='block';
 let p=0; const t=setInterval(()=>{p+=10;progress.style.width=p+'%'; if(p>=100){clearInterval(t);status.innerText='✅ TO 846757814 – 16 lokationer fundet';result.style.display='block';}},120);
}
function begin(){result.style.display='none';pick.style.display='block';show();}
function show(){let r=rows[i];step.innerText=`${i+1}/16`;loc.innerText=r[0];desc.innerText=r[3];art.innerText=r[1];ean.innerText=r[2];need.innerText=r[4]+' stk';scan.value='';msg.innerText='';}
scan.oninput=()=>{let r=rows[i];let v=scan.value.trim();if(v===r[1]||v===r[2]){msg.style.color='green';msg.innerText='✔ Godkendt';setTimeout(()=>{i++;if(i<rows.length)show();else document.body.innerHTML='<header><h2>TO FÆRDIG</h2></header><div class=card><h1>✔ 846757814</h1></div>';},400);}else if(v.length>=7){msg.style.color='red';msg.innerText='✖ Forkert vare';}}
</script></body></html>
