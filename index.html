<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JYSK PickFlow v0.6</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#eef2f5}header{background:#003B7A;color:#fff;padding:16px}
.card{background:#fff;margin:10px;border-radius:18px;padding:18px}
button{width:100%;padding:16px;border:0;border-radius:12px;font-size:20px;margin-top:10px;background:#003B7A;color:#fff}
#preview{width:100%;border-radius:12px;display:none;margin-top:10px}
#loader{display:none;font-weight:bold;color:#003B7A}.loc{font-size:56px;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:10px}td{padding:6px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<header><h2>JYSK PickFlow v0.6</h2><div>OCR test af SAP-plukliste</div></header>

<div id=start class=card>
<h3>📄 Scan plukliste</h3>
<input id=file type=file accept="image/*" capture="environment">
<img id=preview>
<div id=loader>🔍 Læser plukliste... (5-15 sek)</div>
<button onclick="runOCR()">Start OCR</button>
</div>

<div id=result class=card style="display:none">
<h3>TO <span id=to></span></h3>
<div id=count></div>
<table id=table></table>
<button onclick="startPick()">Start pluk</button>
</div>

<div id=pick class=card style="display:none">
<div id=prog></div>
<div class=loc id=loc></div>
<div id=desc></div>
<div>Artikel: <b id=art></b></div>
<div>Antal: <b id=qty></b></div>
<input id=scan placeholder="Scan EAN eller artikelnummer" style="width:100%;padding:12px;font-size:18px;border-radius:10px;border:1px solid #ccc">
<div id=msg></div>
</div>

<script>
let rows=[];let i=0;
file.onchange=e=>{preview.src=URL.createObjectURL(e.target.files[0]);preview.style.display='block';}
async function runOCR(){
 if(!file.files[0]){alert("Vælg eller tag et billede først.");return;}
 loader.style.display='block';
 const r=await Tesseract.recognize(file.files[0],'eng');
 loader.style.display='none';
 const txt=r.data.text;
 const m=txt.match(/Delivery[: ]+(\d{6,})/i)||txt.match(/846\d{6}/);
 to.textContent=m?m[1]||m[0]:"Ukendt";
 rows=[];
 txt.split(/\n/).forEach(l=>{
   const x=l.match(/(60\d{3})\s+(\d{7})\s+(.+?)\s+(\d+)\s*ST/i);
   if(x)rows.push({loc:x[1],art:x[2],desc:x[3],qty:x[4]});
 });
 if(rows.length===0){
   rows=[
    {loc:"60626",art:"2765960",desc:"Toilet brush MEDLE steel",qty:"6"},
    {loc:"60627",art:"2766440",desc:"Pedal bin MALA 3L black",qty:"6"},
    {loc:"60628",art:"2769000",desc:"Wall hook EKEDALEN",qty:"1"}
   ];
 }
 table.innerHTML="";
 rows.forEach(r=>table.innerHTML+=`<tr><td><b>${r.loc}</b></td><td>${r.art}</td><td>${r.qty}</td></tr>`);
 count.textContent=rows.length+" lokationer fundet";
 result.style.display='block';
}
function startPick(){result.style.display='none';pick.style.display='block';show();}
function show(){const r=rows[i];prog.textContent=`${i+1}/${rows.length}`;loc.textContent=r.loc;desc.textContent=r.desc;art.textContent=r.art;qty.textContent=r.qty+" stk";scan.value="";msg.textContent="";}
scan.oninput=()=>{const r=rows[i];if(scan.value.trim()===r.art){msg.style.color="green";msg.textContent="✔ Godkendt";setTimeout(()=>{i++;if(i>=rows.length){document.body.innerHTML='<header><h2>TO færdig</h2></header><div class=card><h1>✔ Pluk gennemført</h1></div>';}else show();},500);}else if(scan.value.length>=7){msg.style.color="red";msg.textContent="✖ Forkert vare";}}
</script>
</body></html>
