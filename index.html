<!doctype html><html lang='da'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<link rel='manifest' href='manifest.json'><link rel='stylesheet' href='css/style.css'>
<title>JYSK PickFlow v1.0.1</title></head><body>
<header><h2>JYSK PickFlow v1.0.1</h2><p>Projektstruktur klar</p></header>
<div class='card'><input id=file type=file accept='image/*' capture='environment' hidden>
<button onclick="file.click()">📄 Scan plukliste</button><img id=preview style='display:none;width:100%;margin-top:12px;border-radius:12px'>
<div class=progress><div id=bar class=bar></div></div></div>
<div id=result class='card' style='display:none'><h3>TO 846757814</h3><p>16 lokationer fundet.</p>
<table id=tbl></table><button onclick="startPick()">Start pluk</button></div>
<div id=pick class='card' style='display:none'><div id=step></div><div id=loc class=loc></div>
<div id=desc></div><div>Artikel: <b id=art></b></div><div>EAN: <b id=ean></b></div>
<input id=scan placeholder='Scan EAN eller artikelnummer'></div>
<script src='js/data.js'></script><script src='js/app.js'></script></body></html>
