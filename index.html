<!doctype html><html lang='da'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>JYSK PickFlow v0.9</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f5}
header{background:#003B7A;color:#fff;padding:16px}
.card{background:#fff;margin:10px;border-radius:18px;padding:18px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#003B7A;color:#fff;font-size:20px;margin-top:8px}
.loc{font-size:58px;font-weight:800}.ok{position:fixed;inset:0;background:#1E8E3E;color:#fff;display:none;align-items:center;justify-content:center;font-size:54px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{background:#fff;color:#000;border:1px solid #bbb}
</style></head><body>
<div id='ok' class='ok'>✔ GODKENDT</div>
<header><h2>JYSK PickFlow v0.9</h2><div>Første komplette plukflow</div></header>
<div id='start' class='card'><button onclick='load()'>📄 Scan plukliste (test)</button></div>
<div id='list' class='card' style='display:none'><h3>TO 846757814</h3><p>16 lokationer fundet.</p><button onclick='begin()'>Start pluk</button></div>
<div id='pick' class='card' style='display:none'>
<div id='step'></div><div id='loc' class='loc'></div><div id='desc'></div>
<div>Artikel: <b id='art'></b></div><div>EAN: <b id='ean'></b></div><div>Skal plukkes: <b id='need'></b></div>
<input id='scan' placeholder='Scan EAN eller artikelnummer' style='width:100%;padding:12px;font-size:18px;margin-top:10px'>
<div id='qtyPanel' style='display:none'><h3>Hvor mange tog du?</h3>
<div class='grid' id='grid'></div><button onclick='confirmQty()' style='background:#1E8E3E'>Bekræft antal</button></div>
<div id='msg'></div></div>
<script>
const rows=[["60626","2765960","5703333141734","Toilet brush MEDLE steel",6],["60627","2766440","5703333141735","Pedal bin MALA",6],["60628","2769000","5703333141736","Wall hook EKEDALEN",1],["60629","2769800","5703333141737","Tray BILLSTA",6],["60630","2773701","5703333141738","MOHEDA diffuser",6],["60631","2773801","5703333141739","MOHEDA ocean",6],["60633","2778312","5703333141740","Shower shelf",4],["60634","2779802","5703333141741","BALSBY brush",6],["60635","2780940","5703333141742","HALLERNA hairbrush",12],["60639","2781500","5703333141743","RIALA hooks",10],["60640","2781700","5703333141744","FORSBY squeegee",12],["60641","2784103","5703333141745","STOCKVIK holder",6],["60642","3248411","5703333141746","HYLLA",1],["60643","3264346","5703333141747","STRIA 120",1],["60650","3264378","5703333141748","STRIA 160",1],["60666","3271032","5703333141749","BILLEFJORD",1]];
let i=0,currentQty=1;
function load(){start.style.display='none';list.style.display='block';}
function begin(){list.style.display='none';pick.style.display='block';show();}
function show(){let r=rows[i];step.innerText=`Lokation ${i+1}/${rows.length}`;loc.innerText=r[0];desc.innerText=r[3];art.innerText=r[1];ean.innerText=r[2];need.innerText=r[4]+" stk";scan.value='';qtyPanel.style.display='none';msg.innerText='';}
scan.oninput=()=>{let r=rows[i];let v=scan.value.trim();if(v===r[1]||v===r[2]){ok.style.display='flex';navigator.vibrate&&navigator.vibrate(60);setTimeout(()=>{ok.style.display='none';buildQty(r[4]);qtyPanel.style.display='block';},500);}else if(v.length>=7){msg.style.color='red';msg.innerText='✖ Forkert vare';}};
function buildQty(max){grid.innerHTML='';[1,2,4,6,8,10,12,max].filter((v,p,a)=>v<=max&&a.indexOf(v)===p).forEach(v=>{let b=document.createElement('button');b.innerText=v;b.onclick=()=>currentQty=v;grid.appendChild(b);});currentQty=max;}
function confirmQty(){i++;if(i>=rows.length){document.body.innerHTML="<header><h2>TO FÆRDIG</h2></header><div class='card'><h1>✔ 846757814</h1><p>16 lokationer plukket.</p></div>";}else show();}
</script></body></html>
