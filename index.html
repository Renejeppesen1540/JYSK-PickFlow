<!doctype html><html lang='da'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>JYSK PickFlow v2.0</title><link rel='manifest' href='manifest.json'>
<style>
body{margin:0;font-family:Arial;background:#d9dde0}header{background:#003b82;color:#fff;padding:24px;font-size:22px;font-weight:bold}
.card{max-width:760px;margin:24px auto;background:#fff;border-radius:16px;padding:24px}
input,button{width:100%;padding:16px;border-radius:10px;border:1px solid #bbb;margin:10px 0;font-size:18px}
button{background:#003b82;color:#fff;border:none;cursor:pointer}
#pick{display:none}.loc{font-size:74px;text-align:center;font-weight:bold}.top{background:#eef3fb;padding:10px;border-radius:8px}
#camera{display:none}
video{width:100%;border-radius:12px}
.bar{height:10px;background:#ddd;border-radius:10px;overflow:hidden}.fill{height:100%;background:#1fa34a;width:0}
.ok{background:#1fa34a!important}
</style></head><body>
<header>JYSK PickFlow v2.0</header>
<div class='card' id='login'><h2>Login</h2>
<input id=i value='RLO'><input id=n value='René Jeppesen'><input id=d value='D020'>
<button onclick='login()'>Gem og fortsæt</button></div>
<div class='card' id='camera'><div class='top' id='user'></div><h2>Scan plukliste</h2><video id=v autoplay playsinline></video><button onclick='capture()'>📷 Tag billede</button><button onclick='demo()'>Brug demo-plukliste</button></div>
<div class='card' id='pick'><div class='top' id='u'></div><h2 id='to'>TO</h2><div style='text-align:right' id='prog'></div><div class='bar'><div class='fill' id='fill'></div></div><div class='loc' id='loc'></div><p>Artikel: <b id='art'></b></p><p>Antal: <b id='qty'></b></p><input id=s placeholder='Scan artikel eller EAN' autofocus><button onclick='ok()'>Godkend</button></div>
<script>
const LIST=[[60626,2765960,6],[60627,2766440,6],[60628,2769000,1],[60629,2769800,6],[60630,2773701,6],[60631,2773801,6],[60633,2778312,4],[60634,2779802,6],[60635,2780940,12],[60639,2781500,10],[60640,2781700,12],[60641,2784103,6],[60642,3248411,1],[60643,3264346,1],[60650,3264378,1],[60666,3271032,1]];
let idx=0,start,user={};let stream;
function login(){user={i:i.value,n:n.value,d:d.value};localStorage.pickUser=JSON.stringify(user);login.style.display='none';camera.style.display='block';userInfo();}
function userInfo(){user=JSON.parse(localStorage.pickUser);user.innerHTML='';document.getElementById('user').textContent=`${user.i} • ${user.n} • ${user.d}`;document.getElementById('u').textContent=`${user.i} • ${user.n} • ${user.d}`;navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(st=>{stream=st;v.srcObject=st}).catch(()=>{});}
function capture(){if(stream)stream.getTracks().forEach(t=>t.stop());demo();}
function demo(){camera.style.display='none';pick.style.display='block';start=new Date();show();}
function show(){let x=LIST[idx];to.textContent='TO 846757814';prog.textContent=`${idx+1}/${LIST.length}`;fill.style.width=((idx)/LIST.length*100)+'%';loc.textContent=x[0];art.textContent=x[1];qty.textContent=x[2]+' stk';s.value='';s.focus();}
function ok(){let x=LIST[idx],v=s.value.trim();if(v==x[1]||v==x[0]||v==''){if(navigator.vibrate)navigator.vibrate(120);idx++;if(idx<LIST.length)show();else finish();}else{alert('Forkert scan');}}
function finish(){fill.style.width='100%';let end=new Date(),min=Math.round((end-start)/60000);let body=`TO:846757814\nPlukker:${user.n} (${user.i})\nAfdeling:${user.d}\nTid:${min} min\nLokationer:${LIST.length}`;location.href='mailto:rloejeppesen@gmail.com?subject=JYSK PickFlow TO 846757814&body='+encodeURIComponent(body);pick.innerHTML='<h2>✅ Pluk færdig</h2><p>Mail åbnet.</p>';}
if(localStorage.pickUser){user=JSON.parse(localStorage.pickUser);i.value=user.i;n.value=user.n;d.value=user.d;}
</script></body></html>
