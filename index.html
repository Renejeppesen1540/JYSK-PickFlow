
<!doctype html><html lang=da><head>
<meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>
<title>JYSK PickFlow v1.0</title>
<link rel=manifest href=manifest.json><link rel=stylesheet href=css/style.css>
</head><body>
<header><h2>JYSK PickFlow v1.0</h2><div>Ny projektstruktur</div></header>

<div class=card>
<input id=file type=file accept='image/*' capture='environment' hidden>
<button onclick="file.click()">📄 Scan plukliste</button>
<img id=preview style="display:none;width:100%;border-radius:12px;margin-top:12px">
<div class=progress><div id=progress class=bar></div></div>
</div>

<div id=result class=card style="display:none">
<h3>TO <span id=to></span></h3>
<table id=table></table>
<button onclick="startPicking(PICKLIST)">Start pluk</button>
</div>

<div id=pick class=card style="display:none">
<div id=step></div>
<div id=loc class=loc></div>
<div id=desc></div>
<div>Artikel: <b id=art></b></div>
<div>EAN: <b id=ean></b></div>
<div>Antal: <b id=qty></b></div>
<input id=scan placeholder="Scan EAN eller artikelnummer" style="width:100%;padding:12px;font-size:18px;margin-top:10px">
<div id=msg></div>
</div>

<script src=js/data.js></script>
<script src=js/scanner.js></script>
<script src=js/ocr.js></script>
<script src=js/picking.js></script>
<script src=js/app.js></script>
</body></html>
