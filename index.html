<!doctype html><html lang='da'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>JYSK PickFlow v1.2.1</title>
<link rel='stylesheet' href='css/style.css'>
<link rel='manifest' href='manifest.json'></head><body>
<header><h1>JYSK PickFlow v1.2.1</h1><div id='userBar' style='display:none'></div></header>
<section id='login' class='card'><h2>Første login</h2>
<input id='initials' placeholder='Initialer'>
<input id='name' placeholder='Navn'>
<input id='store' value='D020' placeholder='Butik'>
<button id='saveBtn'>Gem og fortsæt</button></section>
<section id='app' class='card' style='display:none'>
<button id='logoutBtn'>Skift bruger</button>
<input id='fileInput' type='file' accept='image/*' capture='environment' hidden>
<button id='scanBtn'>📄 Scan plukliste</button>
<div id='progress'><div id='bar'></div></div>
<div id='result' style='display:none'><h3>TO 846757814</h3><p>16 lokationer fundet.</p>
<table id='tbl'></table><button id='startBtn'>Start pluk</button></div>
<div id='pick' style='display:none'>
<div id='step'></div><h1 id='loc'></h1><div id='desc'></div><div>Artikel: <b id='art'></b></div><div>EAN: <b id='ean'></b></div><div>Antal: <b id='qty'></b></div>
<input id='scanInput' placeholder='Scan EAN eller artikelnummer'><div id='msg'></div></div>
</section>
<script src='js/data.js'></script><script src='js/app.js'></script></body></html>
